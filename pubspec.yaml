name: pi_yz
description: "把电脑上 pi 的会话搬到手机上：局域网直连 pi-yz-server 的 Android 客户端"
publish_to: 'none'
version: 0.2.0+2
homepage: https://github.com/CYXyouzhi/pi-yz
repository: https://github.com/CYXyouzhi/pi-yz
issue_tracker: https://github.com/CYXyouzhi/pi-yz/issues

environment:
  sdk: ^3.13.4

dependencies:
  dartssh2: ^4.1.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # App 内启动遮罩用的图（由 tool/make-android-assets.ps1 从原图缩出来）
  assets:
    - assets/splash.png
